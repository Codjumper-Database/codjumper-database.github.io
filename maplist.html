<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maplist Spreadsheet</title>
  <!-- PapaParse library to reliably parse CSV data -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
      font-weight: 600;
    }
    tr:nth-child(even) {
      background-color: #fafafa;
    }
    .status {
      color: #666;
      margin-bottom: 15px;
    }
    .error {
      color: #d93025;
    }
  </style>
</head>
<body>

  <h2>Maplist</h2>
  <div id="status" class="status">Loading spreadsheet...</div>
  
  <div class="table-container">
    <table id="dataTable"></table>
  </div>

  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1fcJr6loTebULCc2HfhazuYOa0eLgb_geewnPvxCo8Ic/edit?usp=sharing';
    const TAB_NAME = 'Maplist';

    function formatToCsvUrl(url, sheetName) {
      const googleSheetRegex = /docs\.google\.com\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/;
      const match = url.match(googleSheetRegex);
      
      if (match && match[1]) {
        const sheetId = match[1];
        const sheetParam = sheetName ? `&sheet=${encodeURIComponent(sheetName)}` : '';
        return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv${sheetParam}`;
      }
      
      return url;
    }

    function loadSpreadsheet() {
      const statusEl = document.getElementById('status');
      const tableEl = document.getElementById('dataTable');
      const csvUrl = formatToCsvUrl(SHEET_URL, TAB_NAME);

      Papa.parse(csvUrl, {
        download: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            statusEl.textContent = '';
            renderTable(results.data);
          } else {
            statusEl.textContent = 'No data found in the spreadsheet.';
            statusEl.classList.add('error');
          }
        },
        error: function(err) {
          statusEl.textContent = 'Error loading spreadsheet. Make sure the sheet is set to "Anyone with the link can view".';
          statusEl.classList.add('error');
          console.error(err);
        }
      });
    }

    function renderTable(data) {
      const table = document.getElementById('dataTable');
      table.innerHTML = '';
      
      // Create Table Header (First Row)
      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');
      data[0].forEach(cellText => {
        const th = document.createElement('th');
        th.textContent = cellText;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      table.appendChild(thead);

      // Create Table Body (Remaining Rows)
      const tbody = document.createElement('tbody');
      for (let i = 1; i < data.length; i++) {
        const row = document.createElement('tr');
        data[i].forEach(cellText => {
          const td = document.createElement('td');
          td.textContent = cellText;
          row.appendChild(td);
        });
        tbody.appendChild(row);
      }
      table.appendChild(tbody);
    }

    // Automatically fetch and render when the page finishes loading
    window.addEventListener('DOMContentLoaded', loadSpreadsheet);
  </script>

</body>
</html>
